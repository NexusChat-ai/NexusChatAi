<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0b10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="NexusChat">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>NexusChat</title>
<style>
:root{
  --bg:#0a0b10;--s1:#12141c;--s2:#1a1d28;--s3:#232736;--line:#242838;--text:#f1f3f9;--mut:#8b92a8;
  --a1:#7c5cff;--a2:#ff4d9d;--a3:#ffb347;--grad:linear-gradient(135deg,#7c5cff,#ff4d9d);
  --ring:linear-gradient(45deg,#ffb347,#ff4d9d,#7c5cff);--danger:#ff5d6c;--ok:#34d27f;
  --sb:env(safe-area-inset-bottom,0px);--st:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;overscroll-behavior:none}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
h1,h2,h3,p{margin:0}
.hidden{display:none!important}
.ic{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.sm{width:18px;height:18px}.ic.lg{width:26px;height:26px}
.ic.on{fill:currentColor}
#app{position:relative;max-width:520px;height:100dvh;margin:0 auto;background:var(--bg);overflow:hidden;box-shadow:0 0 0 1px var(--line)}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg)}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}

/* controls */
.btn{padding:11px 18px;border-radius:12px;background:var(--grad);font-weight:600;color:#fff;transition:.15s;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:active{transform:scale(.97)}
.btn.sec{background:var(--s3);color:var(--text)}
.btn.danger{background:rgba(255,93,108,.14);color:var(--danger)}
.btn.sm{padding:7px 13px;border-radius:10px;font-size:.85rem}
.btn:disabled{opacity:.5}
.input{width:100%;padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:var(--s1);outline:none;transition:.15s}
.input:focus{border-color:var(--a1);box-shadow:0 0 0 3px rgba(124,92,255,.2)}
textarea.input{resize:none}
.ib{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--s1);position:relative;color:var(--text)}
.ib:active{background:var(--s3)}
.dot{position:absolute;top:3px;right:3px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--a2);color:#fff;font-size:.66rem;font-weight:700;display:grid;place-items:center;border:2px solid var(--bg)}

/* avatar, ring, presence */
.av{width:var(--s);height:var(--s);border-radius:50%;flex:none;position:relative}
.av-in{width:100%;height:100%;border-radius:50%;overflow:hidden;display:grid;place-items:center;font-weight:700;color:#fff;font-size:calc(var(--s)*.4)}
.av-in img{width:100%;height:100%;object-fit:cover;display:block}
.av.ring{background:var(--ring);padding:2.5px}
.av.ring .av-in{border:2.5px solid var(--bg)}
.av .pres{position:absolute;right:calc(var(--s)*.02);bottom:calc(var(--s)*.02);width:calc(var(--s)*.27);height:calc(var(--s)*.27);min-width:10px;min-height:10px;border-radius:50%;background:var(--ok);border:2.5px solid var(--bg)}

/* connection banner */
#net{position:absolute;top:0;left:0;right:0;z-index:60;padding:calc(6px + var(--st)) 12px 6px;text-align:center;font-size:.8rem;font-weight:600;background:#ffb347;color:#2a1c00;transform:translateY(-110%);transition:.25s}
#net.show{transform:none}
#net.back{background:var(--ok);color:#06210f}

/* auth */
#auth{justify-content:center;padding:28px 24px;overflow-y:auto}
.logo{font-size:2.1rem;font-weight:800;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;text-align:center;letter-spacing:-.5px}
.tag{color:var(--mut);text-align:center;margin:6px 0 26px}
.seg{display:flex;background:var(--s1);border-radius:12px;padding:4px;margin-bottom:16px}
.seg button{flex:1;padding:10px;border-radius:9px;color:var(--mut);font-weight:600}
.seg button.on{background:var(--s3);color:var(--text)}
#authForm{display:flex;flex-direction:column;gap:12px}
.err{color:var(--danger);font-size:.88rem;min-height:1.2em;text-align:center}
.hint{color:var(--mut);font-size:.78rem;text-align:center;margin-top:14px;line-height:1.5}

/* top bar + mode switch */
.top{padding:calc(10px + var(--st)) 14px 6px;display:flex;flex-direction:column;gap:10px}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.top-row .logo{font-size:1.35rem;text-align:left;flex:1}
.mode{display:flex;background:var(--s1);border-radius:14px;padding:4px;gap:4px}
.mode button{flex:1;padding:9px 6px;border-radius:11px;color:var(--mut);font-weight:600;font-size:.9rem;display:flex;align-items:center;justify-content:center;gap:7px;position:relative}
.mode button.on{background:var(--s3);color:var(--text)}
.mode .dot{position:static;border:0;margin-left:2px}
.search{position:relative}
.search input{padding-left:42px;border-radius:22px}
.search .ic{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--mut)}
.subtabs{display:flex;gap:6px;padding:4px 14px 8px;overflow-x:auto;scrollbar-width:none}
.subtabs button{padding:8px 16px;border-radius:18px;background:var(--s1);color:var(--mut);font-weight:600;font-size:.86rem;display:flex;gap:6px;align-items:center;white-space:nowrap}
.subtabs button.on{background:var(--text);color:var(--bg)}
.subtabs .dot{position:static;border:0}

/* stories + notes row */
#storiesRow{display:flex;gap:14px;padding:30px 14px 8px;overflow-x:auto;scrollbar-width:none}
#storiesRow::-webkit-scrollbar{display:none}
.si{display:flex;flex-direction:column;align-items:center;gap:6px;width:70px;flex:none;position:relative}
.si span{font-size:.72rem;color:var(--mut);max-width:70px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bubble{position:absolute;top:-28px;left:50%;transform:translateX(-50%);background:var(--s3);border:1px solid var(--line);padding:4px 9px;border-radius:14px;font-size:.68rem;max-width:84px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;z-index:2;cursor:pointer}
.bubble::after{content:"";position:absolute;bottom:-5px;left:50%;width:8px;height:8px;background:var(--s3);border-right:1px solid var(--line);border-bottom:1px solid var(--line);transform:translateX(-50%) rotate(45deg)}
.bubble.ph{background:transparent;border-style:dashed;color:var(--mut)}
.bubble.ph::after{display:none}
.bubble.none{visibility:hidden}
.plus{position:absolute;right:2px;bottom:20px;width:20px;height:20px;border-radius:50%;background:var(--a1);border:2px solid var(--bg);display:grid;place-items:center;color:#fff}
.plus .ic{width:12px;height:12px;stroke-width:3}

/* lists */
.sec-title{padding:14px 16px 6px;font-size:.74rem;color:var(--mut);text-transform:uppercase;letter-spacing:.07em;font-weight:700}
.row{display:flex;align-items:center;gap:12px;padding:10px 16px;cursor:pointer}
.row:active{background:var(--s1)}
.row .mid{flex:1;min-width:0}
.row .mid b{display:block;font-size:.96rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .mid small{display:block;color:var(--mut);font-size:.84rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.row .meta{color:var(--mut);font-size:.72rem;display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.row.unread .mid b,.row.unread .mid small{color:var(--text);font-weight:700}
.badge{min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--a2);color:#fff;font-size:.68rem;display:inline-grid;place-items:center;font-weight:700}
.lobby-ic{width:54px;height:54px;border-radius:50%;background:var(--grad);display:grid;place-items:center;flex:none;color:#fff}
.empty{padding:40px 28px;text-align:center;color:var(--mut);line-height:1.6;font-size:.92rem}
.card{margin:6px 14px;padding:12px;background:var(--s1);border:1px solid var(--line);border-radius:14px;display:flex;align-items:center;gap:12px}
.card .mid{flex:1;min-width:0}.card .mid b{display:block}.card .mid small{color:var(--mut)}

/* bottom nav */
.nav{display:flex;border-top:1px solid var(--line);background:var(--bg);padding-bottom:var(--sb)}
.nav button{flex:1;padding:10px 0 9px;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.68rem;position:relative}
.nav button.on{color:var(--text)}
.nav .dot{top:4px;right:calc(50% - 22px)}

/* chat */
.bar{display:flex;align-items:center;gap:10px;padding:calc(10px + var(--st)) 12px 10px;border-bottom:1px solid var(--line);background:var(--bg)}
.bar .mid{flex:1;min-width:0;cursor:pointer}
.bar .mid b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .mid small{color:var(--mut);font-size:.78rem;display:flex;align-items:center;gap:5px}
.bar .mid small i{width:7px;height:7px;border-radius:50%;background:var(--ok);display:inline-block}
.bar .mid small.off i{background:var(--mut)}
#msgs{flex:1;overflow-y:auto;padding:14px 12px;display:flex;flex-direction:column;gap:6px}
#msgs>:first-child{margin-top:auto}
.msg{max-width:80%;padding:9px 13px;border-radius:18px;font-size:.95rem;line-height:1.4;overflow-wrap:anywhere;white-space:pre-wrap}
.msg i{display:block;font-style:normal;font-size:.64rem;opacity:.65;margin-top:3px;text-align:right}
.msg .who{display:block;font-size:.72rem;color:var(--a3);font-weight:700;margin-bottom:2px}
.msg.me{align-self:flex-end;background:var(--grad);border-bottom-right-radius:5px}
.msg.them{align-self:flex-start;background:var(--s3);border-bottom-left-radius:5px}
.msg.media{padding:4px}
.msg.media i{padding:0 8px 4px}
.msg img,.msg video{display:block;max-width:100%;max-height:300px;border-radius:14px;background:#000}
.msg audio{display:block;width:230px;max-width:100%;height:38px}
.msg .file{display:flex;align-items:center;gap:10px;padding:8px 10px;color:inherit;text-decoration:none}
.msg .file span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:190px;font-size:.88rem}
.msg .file small{display:block;opacity:.7;font-size:.7rem}
.seen{align-self:flex-end;font-size:.66rem;color:var(--mut);margin-top:-2px}
.composer{display:flex;gap:8px;padding:10px 12px calc(10px + var(--sb));border-top:1px solid var(--line);align-items:flex-end}
.composer textarea{flex:1;resize:none;max-height:110px;padding:11px 14px;border-radius:20px;border:1px solid var(--line);background:var(--s1);outline:none}
.send{width:44px;height:44px;border-radius:50%;background:var(--grad);display:grid;place-items:center;flex:none;color:#fff}
.attach{width:44px;height:44px;border-radius:50%;background:var(--s1);display:grid;place-items:center;flex:none;color:var(--mut)}
.uploading{align-self:flex-end;font-size:.78rem;color:var(--mut);padding:6px 12px;background:var(--s1);border-radius:14px}

/* profile / wall */
.cover{height:150px;background:var(--grad);position:relative}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.cover .back{position:absolute;top:calc(10px + var(--st));left:12px;background:rgba(0,0,0,.45);color:#fff}
.who-box{padding:0 16px 10px;margin-top:-46px;position:relative}
.who-box .av .av-in{border:4px solid var(--bg)}
.who-box h2{margin-top:8px;font-size:1.3rem}
.who-box .handle{color:var(--mut);font-size:.9rem}
.who-box .note{display:inline-block;margin-top:8px;background:var(--s3);padding:5px 11px;border-radius:14px;font-size:.82rem}
.bio{margin-top:10px;line-height:1.5;font-size:.93rem;white-space:pre-wrap;overflow-wrap:anywhere}
.facts{display:flex;flex-wrap:wrap;gap:8px 14px;margin-top:10px;color:var(--mut);font-size:.84rem}
.facts span{display:flex;align-items:center;gap:5px}
.facts a{color:var(--a1);text-decoration:none}
.stats{display:flex;gap:22px;margin-top:12px}
.stats div{display:flex;flex-direction:column;font-size:.74rem;color:var(--mut)}
.stats b{color:var(--text);font-size:1.05rem}
.actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}

/* posts */
.post-box{margin:0 14px 12px;padding:12px;background:var(--s1);border:1px solid var(--line);border-radius:16px}
.post-box textarea{width:100%;background:none;border:0;outline:none;resize:none;min-height:56px}
.post-box .bt{display:flex;justify-content:space-between;align-items:center;gap:8px}
.mpv{position:relative;margin:6px 0}
.mpv img,.mpv video{width:100%;max-height:260px;object-fit:contain;border-radius:12px;background:#000;display:block}
.mpv .x{position:absolute;top:6px;right:6px;width:30px;height:30px;border-radius:50%;background:rgba(0,0,0,.6);display:grid;place-items:center;color:#fff}
.post{margin:0 14px 12px;background:var(--s1);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.post .ph{display:flex;align-items:center;gap:10px;padding:12px 12px 8px}
.post .ph .mid{flex:1;min-width:0}
.post .ph b{display:block;font-size:.95rem}
.post .ph small{color:var(--mut);font-size:.74rem}
.post .rp{padding:8px 14px 0;color:var(--mut);font-size:.78rem;display:flex;gap:6px;align-items:center}
.post p{padding:0 14px 10px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.45}
.post .media img,.post .media video{width:100%;max-height:480px;object-fit:contain;display:block;background:#000}
.post .orig{margin:0 12px 10px;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.post .orig .ph{padding:10px 10px 4px}
.post .orig p{padding:0 10px 10px}
.post .counts{display:flex;gap:14px;padding:10px 14px 0;color:var(--mut);font-size:.78rem}
.post .acts{display:flex;justify-content:space-around;padding:4px 6px 6px}
.post .acts button{display:flex;align-items:center;gap:6px;padding:9px 12px;color:var(--mut);font-size:.84rem;border-radius:10px}
.post .acts button.on{color:var(--a2)}
.post .acts button:active{background:var(--s2)}
.comments{border-top:1px solid var(--line);padding:8px 14px 12px;display:flex;flex-direction:column;gap:10px}
.cm{display:flex;gap:9px;align-items:flex-start}
.cm .body{background:var(--s2);padding:7px 11px;border-radius:14px;font-size:.88rem;overflow-wrap:anywhere;min-width:0}
.cm .body b{display:block;font-size:.76rem}
.cm .body small{color:var(--mut);font-size:.66rem;margin-left:6px}
.cm .del{color:var(--mut);font-size:.7rem;margin-left:6px}
.cm-in{display:flex;gap:8px}
.cm-in input{flex:1;padding:9px 13px;border-radius:18px;border:1px solid var(--line);background:var(--s2);outline:none}

/* notifications */
.nt{display:flex;gap:12px;align-items:center;padding:11px 16px;cursor:pointer}
.nt.new{background:rgba(124,92,255,.09)}
.nt .txt{flex:1;min-width:0;font-size:.9rem;line-height:1.35}
.nt .txt small{display:block;color:var(--mut);font-size:.72rem;margin-top:2px}
.nt .kind{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--s3);flex:none}

/* settings */
.form{padding:16px;display:flex;flex-direction:column;gap:14px}
.form label{font-size:.8rem;color:var(--mut);display:block;margin-bottom:6px}
.upl{display:flex;gap:8px;margin-top:8px;align-items:center}
.upl small{color:var(--mut);font-size:.78rem}
.toggle{display:flex;justify-content:space-between;align-items:center;padding:6px 0}

/* overlays */
#modal{position:absolute;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:flex-end;z-index:20}
.sheet{width:100%;background:var(--s1);border-radius:22px 22px 0 0;padding:20px 18px calc(20px + var(--sb));display:flex;flex-direction:column;gap:12px;max-height:92%;overflow-y:auto}
.sheet h3{font-size:1.08rem}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:6px 12px;border-radius:16px;background:var(--s3);font-size:.82rem}
.btns{display:flex;gap:8px;flex-wrap:wrap}.btns .btn{flex:1}
.opt{display:flex;align-items:center;gap:14px;padding:13px 4px;font-size:1rem;width:100%;text-align:left}
#viewer{position:absolute;inset:0;background:#000;z-index:30;display:flex;flex-direction:column;justify-content:center}
#viewer img,#viewer video{width:100%;max-height:100%;object-fit:contain}
.v-bar{position:absolute;top:calc(8px + var(--st));left:10px;right:10px;height:3px;background:rgba(255,255,255,.3);border-radius:2px;overflow:hidden;z-index:2}
.v-bar i{display:block;height:100%;background:#fff;width:0}
.v-head{position:absolute;top:calc(18px + var(--st));left:12px;right:12px;display:flex;align-items:center;gap:10px;z-index:2}
.v-head b{display:block;text-shadow:0 1px 4px #000}.v-head small{color:#ddd}
.v-head button{color:#fff}
.v-foot{position:absolute;bottom:calc(14px + var(--sb));left:14px;right:14px;display:flex;justify-content:space-between;align-items:center;z-index:2;color:#fff}
.v-cap{position:absolute;left:0;right:0;bottom:calc(70px + var(--sb));text-align:center;padding:0 20px;font-size:1.1rem;font-weight:700;text-shadow:0 2px 8px #000;z-index:2;white-space:pre-wrap}
#toast{position:absolute;left:50%;bottom:90px;transform:translateX(-50%);background:var(--s3);border:1px solid var(--line);padding:10px 16px;border-radius:20px;font-size:.88rem;z-index:70;max-width:88%;text-align:center;box-shadow:0 6px 24px rgba(0,0,0,.5)}

/* calls */
#call{position:absolute;inset:0;z-index:55;background:#07080c}
.call-stage{position:absolute;inset:0;display:flex;flex-direction:column}
#cRemote{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
#cRemote.audioonly{width:1px;height:1px;opacity:0}
.call-center{position:relative;z-index:1;margin:auto;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;text-shadow:0 2px 10px #000}
.call-center.vid{margin:0;position:absolute;top:calc(20px + var(--st));left:16px;align-items:flex-start;text-align:left;flex-direction:row;gap:10px}
.call-center h2{font-size:1.4rem}.call-center p{color:#c9cde0}
#cLocal{position:absolute;top:calc(14px + var(--st));right:14px;width:100px;height:140px;object-fit:cover;border-radius:14px;z-index:2;background:#000;transform:scaleX(-1);border:2px solid rgba(255,255,255,.25)}
.call-btns{position:absolute;bottom:calc(34px + var(--sb));left:0;right:0;display:flex;justify-content:center;gap:18px;z-index:3}
.cb{width:62px;height:62px;border-radius:50%;background:rgba(255,255,255,.16);display:grid;place-items:center;color:#fff;backdrop-filter:blur(8px)}
.cb.red{background:#ff3b4e}.cb.green{background:#34d27f}.cb.on{background:#fff;color:#000}
.cb-l{display:flex;flex-direction:column;align-items:center;gap:6px;color:#fff;font-size:.72rem}
/* editor */
#editor{position:absolute;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column}
.ed-stage{flex:1;min-height:0;display:grid;place-items:center;background:#000;position:relative;overflow:hidden}
.ed-stage canvas,.ed-stage video{max-width:100%;max-height:100%;display:block}
.ed-cap{position:absolute;left:50%;top:70%;transform:translate(-50%,-50%);font-size:1.4rem;font-weight:800;text-align:center;text-shadow:0 2px 8px #000;padding:4px 10px;max-width:90%;touch-action:none;white-space:pre-wrap}
.ed-tools{padding:10px 12px calc(10px + var(--sb));background:var(--s1);display:flex;flex-direction:column;gap:10px}
.ed-row{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;align-items:center}
.ed-row button{padding:8px 14px;border-radius:16px;background:var(--s3);font-size:.82rem;white-space:nowrap;display:flex;gap:6px;align-items:center}
.ed-row button.on{background:var(--text);color:var(--bg)}
.ed-row .lab{font-size:.74rem;color:var(--mut);min-width:54px}
.ed-row input[type=range]{flex:1;accent-color:var(--a1)}
.filt{width:62px;flex:none;text-align:center;font-size:.68rem;color:var(--mut)}
.filt canvas{width:62px;height:62px;border-radius:12px;display:block;margin-bottom:4px;border:2px solid transparent;object-fit:cover}
.filt.on canvas{border-color:var(--a1)}.filt.on{color:var(--text)}
.timeline{display:flex;flex-direction:column;gap:6px}
.trim{position:relative;height:44px;border-radius:10px;background:var(--s3);overflow:hidden}
.trim .sel{position:absolute;top:0;bottom:0;border:2px solid var(--a1);border-radius:8px;background:rgba(124,92,255,.22)}
.trim .play{position:absolute;top:0;bottom:0;width:2px;background:#fff}

/* loaders + typing */
#boot{position:absolute;inset:0;z-index:80;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;transition:opacity .35s}
#boot.gone{opacity:0;pointer-events:none}
.spin{width:30px;height:30px;border-radius:50%;border:3px solid var(--s3);border-top-color:var(--a1);animation:spin .8s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
.logo.pulse{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.55;transform:scale(.97)}}
.sk{background:linear-gradient(90deg,var(--s1) 25%,var(--s3) 37%,var(--s1) 63%);background-size:400% 100%;animation:shim 1.3s ease infinite;border-radius:10px}
@keyframes shim{0%{background-position:100% 50%}100%{background-position:0 50%}}
.sk-row{display:flex;gap:12px;align-items:center;padding:10px 16px}
.sk-row .c{width:54px;height:54px;border-radius:50%;flex:none}
.sk-row .l{flex:1;display:flex;flex-direction:column;gap:8px}.sk-row .l .sk{height:12px}
.sk-post{margin:0 14px 12px;border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:10px}
.media:not([data-done]),.cmedia:not([data-done]){background:linear-gradient(90deg,var(--s2) 25%,var(--s3) 37%,var(--s2) 63%)!important;background-size:400% 100%;animation:shim 1.3s ease infinite}
.msg.typing{padding:12px 14px}
.msg .dots{display:inline-flex;gap:4px;align-items:center}
.msg .dots i{width:7px;height:7px;border-radius:50%;background:var(--mut);animation:bounce 1.2s infinite ease-in-out;display:block;margin:0;opacity:1;font-size:0}
.msg .dots i:nth-child(2){animation-delay:.15s}.msg .dots i:nth-child(3){animation-delay:.3s}
@keyframes bounce{0%,60%,100%{transform:translateY(0);opacity:.45}30%{transform:translateY(-5px);opacity:1}}
.typlabel{font-size:.7rem;color:var(--mut);align-self:flex-start;margin:2px 0 -2px 8px}
.v-head .nm{flex:1}

.pill{font-size:.62rem;font-weight:700;padding:2px 7px;border-radius:9px;background:var(--s3);color:var(--mut);vertical-align:middle;margin-left:4px}
.cover .cbtn{position:absolute;z-index:3;right:12px;bottom:58px;background:rgba(0,0,0,.5);color:#fff}
#wallAv + .plus{position:absolute}
.grp{margin:10px 14px;background:var(--s1);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.grp .gt{padding:12px 16px 4px;font-size:.72rem;color:var(--mut);text-transform:uppercase;letter-spacing:.07em;font-weight:700}
.set{display:flex;align-items:center;gap:12px;padding:13px 16px;border-top:1px solid var(--line);width:100%;text-align:left;cursor:pointer}
.grp .gt+.set{border-top:0}
.set .t{flex:1;min-width:0}.set .t b{display:block;font-weight:600;font-size:.95rem}.set .t small{display:block;color:var(--mut);font-size:.78rem;margin-top:2px;line-height:1.35}
.set .ic{color:var(--mut)}
.sw{appearance:none;-webkit-appearance:none;width:46px;height:28px;border-radius:14px;background:var(--s3);position:relative;transition:.2s;flex:none;cursor:pointer;margin:0}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s}
.sw:checked{background:var(--a1)}.sw:checked::after{left:21px}
.swatches{display:flex;gap:10px;padding:4px 16px 14px}
.swatches button{width:34px;height:34px;border-radius:50%;border:3px solid transparent}
.swatches button.on{border-color:#fff}
.set select{background:var(--s3);border:0;padding:7px 10px;border-radius:10px}

/* friend workflow */
async function sendRequest(u) {
  if (u === S.me) return toast("You can't add yourself.");
  if (S.friends[u]) return toast('You are already friends.');
  if (S.requests[u]) return toast('They already sent you a request. Accept it first.');
  try {
    if (!(await get(ref(db, `users/${u}/createdAt`))).exists()) return toast('User not found.');
    await set(ref(db, `friend_requests/${u}/${S.me}`), { timestamp: Date.now() });
    if (S.searchRes?.username === u) S.searchRes.state = 'requested';
    renderHome(); toast('Friend request sent');
  } catch { toast('Could not send request.'); }

async function acceptRequest(sender) {
  const ts = Date.now();

    await update(ref(db), { [`friends/${S.me}/${sender}`]: ts, [`friends/${sender}/${S.me}`]: ts, [`friend_requests/${S.me}/${sender}`]: null });

  } catch { toast('Could not accept request.'); }
}

/* ================= media helpers ================= */
const mediaCache = {};
async function getMedia(path) {
  if (mediaCache[path]) return mediaCache[path];
  try { const s = await get(ref(db, path)); const d = s.val()?.data || ''; if (d) mediaCache[path] = d; return d; } catch { return ''; }
}
function pickFile(accept = 'image/*') {
  return new Promise(res => {
    const i = document.createElement('input');
    i.type = 'file'; i.accept = accept;
    i.onchange = () => res(i.files[0] || null);
    i.click();
  });
}
const readDataURL = f => new Promise((res, rej) => { const r = new FileReader(); r.onerror = rej; r.onload = () => res(r.result); r.readAsDataURL(f); });
function fileToImage(file, max = 900, q = 0.8) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onerror = () => { URL.revokeObjectURL(url); rej(); };
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      res(c.toDataURL('image/jpeg', q));
    };
    img.src = url;
  });
}
function mediaTag(data, type) {
  const d = esc(safeUrl(data));
  return type === 'video' ? `<video src="${d}" controls playsinline preload="metadata"></video>`
    : type === 'audio' ? `<audio src="${d}" controls preload="metadata"></audio>`
    : `<img src="${d}" alt="">`;
}
function fillMedia(el, data) { el.dataset.done = '1'; el.style.minHeight = ''; el.innerHTML = mediaTag(data, el.dataset.mtype); }
const mediaIO = new IntersectionObserver(entries => {
  for (const en of entries) {
    if (!en.isIntersecting) continue;
    const el = en.target; mediaIO.unobserve(el);
    getMedia(el.dataset.mpath).then(d => { if (d && el.isConnected) fillMedia(el, d); });
  }
}, { rootMargin: '300px' });
const seenViews = new Set();
const viewIO = new IntersectionObserver(entries => {
  for (const en of entries) {
    if (!en.isIntersecting) continue;
    const k = en.target.dataset.k; viewIO.unobserve(en.target);
    const [o, id] = k.split('/');
    if (o === S.me || seenViews.has(k) || S.views[o]?.[id]?.[S.me]) continue;
    seenViews.add(k);
    set(ref(db, `views/${o}/${id}/${S.me}`), Date.now()).catch(() => {});
  }
}, { threshold: 0.6 });
function hydrate(root) {
  root.querySelectorAll('[data-mpath]:not([data-done])').forEach(el => {
    const c = mediaCache[el.dataset.mpath];
    if (c) fillMedia(el, c); else mediaIO.observe(el);
  });
  root.querySelectorAll('.post[data-k]').forEach(el => viewIO.observe(el));
}

  return h + '</div>';

const findPost = k => { const [o, id] = k.split('/'); return (S.posts[o] || []).find(p => p.id === id); };

async function postAction(e, el) {
  const act = el.dataset.act, k = el.dataset.k;
  if (!k) return;
  const [o, id] = k.split('/');
  const p = findPost(k);
  try {
    if (act === 'like') {
      const r = ref(db, `likes/${o}/${id}/${S.me}`);
      if (S.likes[o]?.[id]?.[S.me]) await remove(r);
      else { await set(r, Date.now()); notify(o, 'like', { owner: o, postId: id }); }
    } else if (act === 'cm') {
      openCm.has(k) ? openCm.delete(k) : openCm.add(k); refresh();
      if (openCm.has(k)) setTimeout(() => document.querySelector(`.cm-in input[data-k="${CSS.escape(k)}"]`)?.focus(), 50);
    } else if (act === 'sendcm') {
      submitComment(el.parentElement.querySelector('input'));
    } else if (act === 'delcm') {
      await remove(ref(db, `comments/${o}/${id}/${el.dataset.c}`));
    } else if (act === 'repost') {
      await toggleRepost(p);
    } else if (act === 'share') {
      shareSheet(p);
    } else if (act === 'delpost') {
      if (!confirm('Delete this post?')) return;
      await Promise.all(['posts', 'post_media', 'likes', 'comments', 'views'].map(x => remove(ref(db, `${x}/${S.me}/${id}`))));
      toast('Post deleted');
    }
  } catch { toast('Something went wrong. Try again.'); }
}
async function submitComment(input) {
  const text = input.value.trim(); if (!text) return;
  const k = input.dataset.k, [o, id] = k.split('/');
  input.value = '';
  try {
    await push(ref(db, `comments/${o}/${id}`), { from: S.me, text, ts: Date.now() });
    notify(o, 'comment', { owner: o, postId: id, text: text.slice(0, 120) });
  } catch { input.value = text; toast('Could not send comment.'); }
}
async function toggleRepost(p) {
  if (!p) return;
  if (p.owner === S.me) return toast("You can't repost your own post.");
  const mark = ref(db, `reposts/${p.owner}/${p.id}/${S.me}`);
  const existing = S.reps[p.owner]?.[p.id]?.[S.me];
  if (existing) {
    await Promise.all([remove(mark), remove(ref(db, `posts/${S.me}/${existing}`)), remove(ref(db, `post_media/${S.me}/${existing}`))]);
    return toast('Repost removed');
  }
  const nid = push(ref(db, `posts/${S.me}`)).key;
  if (p.hasMedia) {
    const data = await getMedia(`post_media/${p.owner}/${p.id}`);
    if (data) await set(ref(db, `post_media/${S.me}/${nid}`), { data });
  }
  await set(ref(db, `posts/${S.me}/${nid}`), { text: p.text || '', ts: Date.now(), mtype: p.mtype || '', hasMedia: !!p.hasMedia, orig: { by: p.orig?.by || p.owner, id: p.orig?.id || p.id } });
  await set(mark, nid);
  notify(p.owner, 'repost', { owner: p.owner, postId: p.id });
  toast('Reposted to your profile');
}
function shareSheet(p) {
  if (!p) return;
  const snippet = (p.text || (p.hasMedia ? 'a ' + (p.mtype || 'photo') : '')).slice(0, 80);
  openModal(`<h3>Share post</h3>
    <button class="opt" id="shExt">${ico('share')}Share to other apps</button>

const FILTERS = {
  none:  { n: 'Original', m: [1,0,0, 0,1,0, 0,0,1], o: [0,0,0], sa: 1, co: 1, br: 0 },
  mono:  { n: 'Mono',  m: [.299,.587,.114, .299,.587,.114, .299,.587,.114], o: [0,0,0], sa: 1, co: 1, br: 0 },
  sepia: { n: 'Sepia', m: [.393,.769,.189, .349,.686,.168, .272,.534,.131], o: [0,0,0], sa: 1, co: 1, br: 0 },
  warm:  { n: 'Warm',  m: [1.08,0,0, 0,1,0, 0,0,.9], o: [8,0,-6], sa: 1.1, co: 1, br: 0 },
  cool:  { n: 'Cool',  m: [.92,0,0, 0,1,0, 0,0,1.1], o: [-6,0,8], sa: 1, co: 1, br: 0 },

  fade:  { n: 'Fade',  m: [1,0,0, 0,1,0, 0,0,1], o: [18,18,18], sa: .85, co: .85, br: 0 },

const FONTS = {
  sans:  ['Classic', '-apple-system, Helvetica, Arial, sans-serif', 800],
  bebas: ['Bebas', '"Bebas Neue", Impact, sans-serif', 400],
  pacifico: ['Pacifico', '"Pacifico", cursive', 400],
  lobster: ['Lobster', '"Lobster", cursive', 400],
  marker: ['Marker', '"Permanent Marker", cursive', 400],
  play:  ['Playfair', '"Playfair Display", Georgia, serif', 800],

const loadFont = k => { const f = FONTS[k]; try { return document.fonts.load(`${f[2]} 32px ${f[1].split(',')[0]}`); } catch { return Promise.resolve(); } };
let ED = null;

function applyPix(ctx, W, H, cfg) {
  const f = FILTERS[cfg.filter];

    let G = m[3] * r + m[4] * g + m[5] * b + o[1];
    let B = m[6] * r + m[7] * g + m[8] * b + o[2];

    G = (l + (G - l) * sa - 128) * co + 128 + br;
    B = (l + (B - l) * sa - 128) * co + 128 + br;
    d[i] = R; d[i + 1] = G; d[i + 2] = B;

}

      const dest = actx.createMediaStreamDestination();

      if (M) { M.el.volume = 1; const g = actx.createGain(); g.gain.value = c.mv / 100; actx.createMediaElementSource(M.el).connect(g); g.connect(dest); }
      dest.stream.getAudioTracks().forEach(t => stream.addTrack(t));
    } catch {}
  }
  const rec = new MediaRecorder(stream, { mimeType: mt, videoBitsPerSecond: 800000, audioBitsPerSecond: 64000 });
  const chunks = []; rec.ondataavailable = ev => { if (ev.data.size) chunks.push(ev.data); };
  const done = new Promise(res => { rec.onstop = res; });
  const total = vid ? (c.end - c.start) / c.speed : Math.min(15, M?.dur || 15, e.opts.kind === 'story' ? 15 : 15);
  rec.start(250);
  if (vid) { v.playbackRate = c.speed; await v.play(); }
  if (M) { try { M.el.currentTime = 0; } catch {} await M.el.play().catch(() => {}); }
  const t0 = performance.now();
  await new Promise(res => {
    const iv = setInterval(() => {
      const el = (performance.now() - t0) / 1000;
      msg.textContent = `Processing… ${Math.min(99, Math.round(el / total * 100))}%`;
      const vEnd = vid ? (v.currentTime >= c.end - .05 || v.ended) : false;
      if (vEnd || el >= total + (vid ? 4 : 0)) { clearInterval(iv); res(); }
    }, 120);
  });
  if (vid) v.pause(); M?.el.pause(); rec.stop(); await done;
  try { actx?.close(); } catch {}
  const blob = new Blob(chunks, { type: mt.split(';')[0] });
  if (blob.size > 5.5e6) throw new Error('Video is too large. Trim it shorter and try again.');
  return { data: await readDataURL(blob), type: 'video' };
}

const ICE_CFG = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }, { urls: 'stun:stun1.l.google.com:19302' }] };
let CALL = null, ringCtx = null, ringIv = null;

function ringStart() {
  try {
    ringCtx = new (window.AudioContext || window.webkitAudioContext)();
    const beep = () => { const o = ringCtx.createOscillator(), g = ringCtx.createGain(); o.frequency.value = 480; g.gain.value = .08; o.connect(g); g.connect(ringCtx.destination); o.start(); o.stop(ringCtx.currentTime + .4); };
    beep(); ringIv = setInterval(beep, 1600);
  } catch {}
  try { navigator.vibrate?.([300, 200, 300]); } catch {}
}
function ringStop() { clearInterval(ringIv); ringIv = null; try { ringCtx?.close(); } catch {} ringCtx = null; }

const mmss = ms => { const s = Math.floor(ms / 1000); return `${pad(Math.floor(s / 60))}:${pad(s % 60)}`; };
function callStatus(c) {
  return c.state === 'incoming' ? `Incoming ${c.kind === 'video' ? 'video' : 'voice'} call` : c.state === 'calling' ? 'Calling…' :
    c.state === 'connecting' ? 'Connecting…' : c.startedAt ? mmss(Date.now() - c.startedAt) : 'Connecting…';
}
function callUI() {
  const el = $('#call'), c = CALL;
  if (!c) { el.classList.add('hidden'); el.innerHTML = ''; return; }
  el.classList.remove('hidden');
  const vidOn = c.kind === 'video' && c.state === 'connected';
  const btn = (act, icon, cls, label) => `<div class="cb-l"><button class="cb ${cls}" data-c="${act}" aria-label="${label}">${ico(icon, 'lg')}</button>${label}</div>`;
  const controls = c.state === 'incoming'
    ? btn('decline', 'phone', 'red', 'Decline') + btn('accept', c.kind === 'video' ? 'video' : 'phone', 'green', 'Accept')
    : btn('mute', 'mic', c.muted ? 'on' : '', c.muted ? 'Unmute' : 'Mute') +
      (c.kind === 'video' ? btn('cam', 'video', c.camOff ? 'on' : '', c.camOff ? 'Camera on' : 'Camera off') : '') +
      btn('end', 'phone', 'red', 'End');
  el.innerHTML = `<div class="call-stage">
    <video id="cRemote" autoplay playsinline class="${c.kind === 'video' ? '' : 'audioonly'}"></video>
    <div class="call-center ${vidOn ? 'vid' : ''}">${avatar(c.peer, vidOn ? 52 : 110, false, false)}<div><h2>${esc(name(c.peer))}</h2><p id="cStatus">${callStatus(c)}</p></div></div>
    ${c.kind === 'video' && c.local ? '<video id="cLocal" autoplay playsinline muted></video>' : ''}
    <div class="call-btns">${controls}</div></div>`;
  const r = $('#cRemote'), l = $('#cLocal');
  if (r && c.remote) { r.srcObject = c.remote; r.play?.().catch(() => {}); }
  if (l && c.local) l.srcObject = c.local;
}
$('#call').addEventListener('click', e => {
  const b = e.target.closest('[data-c]'), c = CALL; if (!b || !c) return;
  const a = b.dataset.c;
  if (a === 'accept') acceptCall();
  else if (a === 'decline') declineCall();
  else if (a === 'end') endCall(true, '', c.startedAt ? 'done' : 'missed');
  else if (a === 'mute') { c.muted = !c.muted; c.local?.getAudioTracks().forEach(t => { t.enabled = !c.muted; }); callUI(); }
  else if (a === 'cam') { c.camOff = !c.camOff; c.local?.getVideoTracks().forEach(t => { t.enabled = !c.camOff; }); callUI(); }
});

const getMic = kind => navigator.mediaDevices.getUserMedia({ audio: true, video: kind === 'video' ? { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } } : false });
function makePC(c) {
  const pc = new RTCPeerConnection(ICE_CFG); c.pc = pc;
  c.local.getTracks().forEach(t => pc.addTrack(t, c.local));
  c.remote = new MediaStream();
  pc.ontrack = e => { e.track && c.remote.addTrack(e.track); const r = $('#cRemote'); if (r) { r.srcObject = c.remote; r.play?.().catch(() => {}); } };
  pc.onicecandidate = e => { if (e.candidate) push(ref(db, `calls/${c.key}/ice_${S.me}`), JSON.stringify(e.candidate)).catch(() => {}); };
  pc.onconnectionstatechange = () => {
    if (CALL !== c) return;
    if (pc.connectionState === 'connected' && c.state !== 'connected') {
      c.state = 'connected'; c.startedAt = Date.now(); clearTimeout(c.ringT); callUI();
      c.tick = setInterval(() => { const s = $('#cStatus'); if (s && CALL === c) s.textContent = callStatus(c); }, 1000);
    } else if (pc.connectionState === 'failed') endCall(true, 'Could not connect. Some networks block direct calls.', c.startedAt ? 'done' : 'missed');
  };
  return pc;
}
function watchIce(c, peer) {
  c.unsubs.push(onValue(ref(db, `calls/${c.key}/ice_${peer}`), s => {
    s.forEach(ch => {
      if (c.seen.has(ch.key)) return; c.seen.add(ch.key);
      let cand; try { cand = JSON.parse(ch.val()); } catch { return; }
      if (c.pc?.remoteDescription) c.pc.addIceCandidate(cand).catch(() => {}); else c.pending.push(cand);
    });
  }));
}
const flushIce = c => { c.pending.splice(0).forEach(x => c.pc.addIceCandidate(x).catch(() => {})); };

async function startCall(peer, kind) {
  if (CALL) return toast('You are already in a call.');
  if (!S.friends[peer]) return;
  if (!window.RTCPeerConnection || !navigator.mediaDevices?.getUserMedia) return toast('Calls are not supported in this browser or app.');
  const key = chatKey(S.me, peer);
  const c = CALL = { key, peer, kind, role: 'caller', state: 'calling', seen: new Set(), pending: [], unsubs: [] };
  callUI();
  try { c.local = await getMic(kind); }
  catch { CALL = null; callUI(); return toast('Allow microphone' + (kind === 'video' ? ' and camera' : '') + ' access to make calls.'); }
  if (CALL !== c) { c.local.getTracks().forEach(t => t.stop()); return; }
  callUI();
  try {
    const pc = makePC(c);
    const offer = await pc.createOffer(); await pc.setLocalDescription(offer);
    await set(ref(db, `calls/${key}`), { from: S.me, to: peer, kind, state: 'ringing', ts: Date.now(), offer: { type: offer.type, sdp: offer.sdp } });
    c.unsubs.push(onValue(ref(db, `calls/${key}`), async s => {
      const v = s.val(); if (CALL !== c || !v) return;
      if (v.state === 'accepted' && v.answer && !c.answered) {
        c.answered = true; c.state = 'connecting'; callUI();
        await pc.setRemoteDescription(v.answer); flushIce(c);
      } else if (v.state === 'declined') endCall(false, 'Call declined', 'declined');
      else if (v.state === 'ended') endCall(false, 'Call ended', c.startedAt ? 'done' : 'missed');
    }));
    watchIce(c, peer);
    c.ringT = setTimeout(() => { if (CALL === c && c.state === 'calling') endCall(true, 'No answer', 'missed'); }, 45000);
  } catch { endCall(false, 'Could not start the call.', 'missed'); }
}

function onCallSnap(f, v) {
  if (!v) return;
  if (CALL) {
    if (CALL.peer === f && CALL.role === 'callee' && (v.state === 'ended' || v.state === 'missed')) endCall(false, CALL.state === 'incoming' ? 'Missed call' : 'Call ended');
    return;
  }
  if (v.to === S.me && v.state === 'ringing' && v.offer && Date.now() - v.ts < 45000) {
    if (S.settings.calls === 'none' || S.blocks[f]) { update(ref(db, `calls/${chatKey(S.me, f)}`), { state: 'declined' }).catch(() => {}); return; }
    const c = CALL = { key: chatKey(S.me, f), peer: f, kind: v.kind || 'audio', role: 'callee', state: 'incoming', offer: v.offer, seen: new Set(), pending: [], unsubs: [] };
    callUI(); ringStart();
    c.ringT = setTimeout(() => { if (CALL === c && c.state === 'incoming') endCall(false, ''); }, 45000);
  }
}
async function acceptCall() {
  const c = CALL; if (!c || c.state !== 'incoming') return;
  ringStop(); clearTimeout(c.ringT); c.state = 'connecting'; callUI();
  try { c.local = await getMic(c.kind); }
  catch { update(ref(db, `calls/${c.key}`), { state: 'declined' }).catch(() => {}); CALL = null; callUI(); return toast('Allow microphone' + (c.kind === 'video' ? ' and camera' : '') + ' access to answer calls.'); }
  if (CALL !== c) { c.local.getTracks().forEach(t => t.stop()); return; }
  callUI();
  try {
    const pc = makePC(c);
    watchIce(c, c.peer);
    await pc.setRemoteDescription(c.offer); flushIce(c);
    const ans = await pc.createAnswer(); await pc.setLocalDescription(ans);
    await update(ref(db, `calls/${c.key}`), { answer: { type: ans.type, sdp: ans.sdp }, state: 'accepted' });
  } catch { endCall(true, 'Could not connect the call.'); }
}
function declineCall() {
  const c = CALL; if (!c) return;
  ringStop(); clearTimeout(c.ringT);
  update(ref(db, `calls/${c.key}`), { state: 'declined' }).catch(() => {});
  CALL = null; callUI();
}
async function endCall(write, msg, outcome) {
  const c = CALL; if (!c) return;
  CALL = null;
  clearTimeout(c.ringT); clearInterval(c.tick); ringStop();
  c.unsubs.forEach(u => u());
  try { c.pc?.close(); } catch {}
  c.local?.getTracks().forEach(t => t.stop());
  callUI();
  if (write) update(ref(db, `calls/${c.key}`), { state: outcome === 'missed' ? 'missed' : 'ended' }).catch(() => {});
  if (c.role === 'caller' && S.me && outcome) {
    const label = c.kind === 'video' ? 'Video call' : 'Voice call';
    const text = outcome === 'missed' ? 'Missed ' + label.toLowerCase() : outcome === 'declined' ? label + ' declined' : `${label} · ${mmss(Date.now() - (c.startedAt || Date.now()))}`;
    push(ref(db, `chats/${c.key}/messages`), { from: S.me, text, ts: Date.now(), type: 'call' }).catch(() => {});
  }
  if (msg) toast(msg);
}
$('#callA').onclick = () => startCall(S.chatWith, 'audio');
$('#callV').onclick = () => startCall(S.chatWith, 'video');

/* ================= follow, block, lists, appearance, alerts ================= */
let followUnsubs = {};
function unwatchOwner(o) {
  (ownerUnsubs[o] || []).forEach(u => u()); delete ownerUnsubs[o];
  ['posts', 'likes', 'comments', 'views', 'reps'].forEach(k => delete S[k][o]);
}
function syncFollowing() {
  for (const u of Object.keys(S.following)) {
    if (followUnsubs[u]) continue;
    ensureUser(u);
    followUnsubs[u] = [onValue(ref(db, `users/${u}`), s => { if (s.exists()) S.users[u] = pick(s.val()); refresh(); })];
    watchOwner(u);
  }
  for (const u of Object.keys(followUnsubs)) {
    if (!S.following[u]) { followUnsubs[u].forEach(x => x()); delete followUnsubs[u]; if (!S.friends[u]) unwatchOwner(u); }
  }
}
function stopExtras() {
  Object.values(followUnsubs).forEach(a => a.forEach(x => x())); followUnsubs = {};
  stopGroups();
}

}
async function blockUser(u) {

    await update(ref(db), { [`friends/${S.me}/${u}`]: null, [`friends/${u}/${S.me}`]: null, [`following/${S.me}/${u}`]: null, [`followers/${u}/${S.me}`]: null,
      [`followers/${S.me}/${u}`]: null, [`friend_requests/${S.me}/${u}`]: null, [`blocks/${S.me}/${u}`]: Date.now() });

}
function openMore(u) {

const ACCENTS = { purple: ['#7c5cff', '#ff4d9d'], blue: ['#3b82f6', '#06b6d4'], green: ['#22c55e', '#14b8a6'], orange: ['#f97316', '#ef4444'], pink: ['#ec4899', '#8b5cf6'] };

/* ---- sound + device alerts ---- */
let pingCtx;
function ping() {
  if (S.settings.sound === false) return;
  try {
    pingCtx = pingCtx || new (window.AudioContext || window.webkitAudioContext)();
    const t = pingCtx.currentTime, o = pingCtx.createOscillator(), g = pingCtx.createGain();
    o.type = 'sine'; o.frequency.setValueAtTime(880, t); o.frequency.exponentialRampToValueAtTime(1320, t + .12);
    g.gain.setValueAtTime(.001, t); g.gain.exponentialRampToValueAtTime(.12, t + .02); g.gain.exponentialRampToValueAtTime(.001, t + .25);
    o.connect(g); g.connect(pingCtx.destination); o.start(t); o.stop(t + .26);
  } catch {}
}
function incomingAlert(title, body, chatId) {
  if (S.view === 'chat' && S.chatWith === chatId) return;
  ping();
  if (S.settings.alerts && document.hidden && window.Notification && Notification.permission === 'granted') { try { new Notification(title, { body }); } catch {} }
}

let groupUnsubs = {};

function syncGroups() {
  for (const g of Object.keys(S.myGroups)) {
    if (groupUnsubs[g]) continue;
    groupUnsubs[g] = [
      onValue(ref(db, `groups/${g}`), s => { S.groups[g] = s.val(); Object.keys(s.val()?.members || {}).forEach(ensureUser); refresh(); }),
      onValue(query(ref(db, `group_chats/${g}/messages`), limitToLast(1)), s => {
        let m = null; s.forEach(c => { m = c.val(); }); const prev = S.glast[g]; S.glast[g] = m;
        if (S.ready && m && m.from !== S.me && (!prev || m.ts > prev.ts) && Date.now() - m.ts < 15000 && !S.blocks[m.from]) incomingAlert(S.groups[g]?.name || 'Group', name(m.from) + ': ' + previewOf(m), 'group:' + g);
        refresh();

  for (const g of Object.keys(groupUnsubs)) {

    await set(ref(db, `groups/${gid}/members/${u}`), true); await set(ref(db, `user_groups/${u}/${gid}`), true);
    push(ref(db, `group_chats/${gid}/messages`), { from: S.me, text: 'added ' + name(u), ts: Date.now(), type: 'text' }).catch(() => {});
    toast('Added ' + name(u)); closeModal();
  });
  $('#gLeave').onclick = async () => {
    if (!confirm(owner ? 'Delete this group for everyone?' : 'Leave this group?')) return;
    closeModal();
    try {
      if (owner) {
        for (const u of mem) if (u !== S.me) await remove(ref(db, `user_groups/${u}/${gid}`)).catch(() => {});
        await remove(ref(db, `group_chats/${gid}`)); await remove(ref(db, `groups/${gid}`)); await remove(ref(db, `user_groups/${S.me}/${gid}`));
      } else { await remove(ref(db, `groups/${gid}/members/${S.me}`)); await remove(ref(db, `user_groups/${S.me}/${gid}`)); }
      toast(owner ? 'Group deleted' : 'You left the group');
    } catch { toast('Could not complete that.'); }
  };
}

/* ================= NexusChat AI (Google Gemini) + personas ================= */
const DEFAULT_MODEL = 'gemini-2.5-flash';
const AI_COLORS = { violet: 'linear-gradient(135deg,#7c5cff,#ff4d9d)', ocean: 'linear-gradient(135deg,#3b82f6,#06b6d4)', forest: 'linear-gradient(135deg,#22c55e,#14b8a6)', sunset: 'linear-gradient(135deg,#f97316,#ef4444)', night: 'linear-gradient(135deg,#334155,#0f172a)' };
const BUILTIN_AI = { id: 'nexus', name: 'NexusChat AI', emoji: '', color: 'violet', tag: 'Your built-in assistant', greeting: 'Hi! I am NexusChat AI. Ask me anything.',
  prompt: 'You are NexusChat AI, a friendly and concise assistant inside a messenger app. Keep replies short and conversational unless asked for detail. Light markdown is fine.', temp: .8 };
const PERSONA_TEMPLATES = {
  'Study buddy': 'You are a patient study buddy. Explain things step by step in simple words, ask me a quick question to check I understood, and encourage me.',
  'Code helper': 'You are a senior software engineer. Give short, correct answers with small code examples. Ask a clarifying question if the request is ambiguous.',
  'Translator': 'You translate between English and Filipino (Tagalog). Reply with only the translation, then one short note if the tone or word choice matters.',
  'Hype friend': 'You are my supportive best friend who hypes me up, keeps things light and funny, and gives honest, kind advice.',
  'Story character': 'You are a character in a fantasy story. Stay in character, describe what you do in *asterisks*, and keep the story moving with short replies.'
};
function aiPersona(pid) {
  if (pid === 'nexus') return { ...BUILTIN_AI, ...(S.personas.nexus || {}), id: 'nexus' };
  return S.personas[pid] ? { color: 'violet', temp: .8, ...S.personas[pid], id: pid } : null;
}
const aiIds = () => ['nexus', ...Object.keys(S.personas).filter(k => k !== 'nexus').sort((a, b) => (S.personas[a].createdAt || 0) - (S.personas[b].createdAt || 0))];
function aiRows() {
  let h = `<div class="sec-title" style="display:flex;justify-content:space-between;align-items:center">AI<button class="btn sec sm" data-act="newai">${ico('plus', 'sm')}Persona</button></div>`;
  for (const id of aiIds()) {
    const p = aiPersona(id);
    if (S.query && !p.name.toLowerCase().includes(S.query) && !'ai'.includes(S.query)) continue;
    h += `<div class="row" data-act="ai" data-u="${esc(id)}">${aiAvatar(p, 54)}<div class="mid"><b>${esc(p.name)} <span class="pill">AI</span></b><small>${esc(p.tag || 'Tap to chat')}</small></div></div>`;
  }
  return h;
}

/* ---- persona editor ---- */
function openPersonaList() {
  openModal(`<h3>AI personas</h3>
    ${aiIds().map(id => { const p = aiPersona(id); return `<div class="row" style="padding:8px 0" data-edit="${esc(id)}">${aiAvatar(p, 44)}<div class="mid"><b>${esc(p.name)}</b><small>${esc(p.tag || (id === 'nexus' ? 'Built-in' : 'Custom'))}</small></div>${ico('edit', 'sm')}</div>`; }).join('')}
    <button class="btn" id="pNew" type="button">${ico('plus', 'sm')}Create persona</button>`);
  document.querySelectorAll('#modal [data-edit]').forEach(r => r.onclick = () => openPersonaEditor(r.dataset.edit));
  $('#pNew').onclick = () => openPersonaEditor();
}
function openPersonaEditor(pid) {
  const isNew = !pid, p = pid ? aiPersona(pid) : { name: '', emoji: '', color: 'violet', tag: '', greeting: '', prompt: '', temp: .8 };
  let color = p.color || 'violet';
  openModal(`<h3>${isNew ? 'New persona' : 'Edit ' + esc(p.name)}</h3>
    <div style="display:flex;gap:8px"><input class="input" id="pnEmoji" maxlength="2" placeholder="Icon" style="width:72px;text-align:center" value="${esc(p.emoji)}"><input class="input" id="pnName" maxlength="30" placeholder="Name" value="${esc(p.name)}"></div>
    <div class="swatches" style="padding:0">${Object.entries(AI_COLORS).map(([k, v]) => `<button data-col="${k}" class="${color === k ? 'on' : ''}" style="background:${v}" aria-label="${k}"></button>`).join('')}</div>
    <input class="input" id="pnTag" maxlength="60" placeholder="Short description (shown in your chat list)" value="${esc(p.tag)}">
    <textarea class="input" id="pnPrompt" rows="6" maxlength="2000" placeholder="How should it behave? Example: You are a pirate captain who answers everything with sea metaphors.">${esc(p.prompt)}</textarea>
    <div class="chips">${Object.keys(PERSONA_TEMPLATES).map(k => `<button class="chip" type="button" data-tpl="${esc(k)}">${esc(k)}</button>`).join('')}</div>
    <input class="input" id="pnGreet" maxlength="200" placeholder="Greeting message (optional)" value="${esc(p.greeting)}">
    <div class="ed-row"><span class="lab" style="min-width:96px;font-size:.8rem;color:var(--mut)">Creativity</span><input type="range" id="pnTemp" min="0" max="1.5" step=".1" value="${p.temp ?? .8}" style="flex:1;accent-color:var(--a1)"></div>
    <div class="btns"><button class="btn" id="pnSave" type="button">Save</button>
    ${!isNew ? `<button class="btn sec" id="pnClear" type="button">Clear chat</button><button class="btn danger" id="pnDel" type="button">${pid === 'nexus' ? 'Reset' : 'Delete'}</button>` : ''}</div>`);
  document.querySelectorAll('#modal [data-col]').forEach(b => b.onclick = () => { color = b.dataset.col; document.querySelectorAll('#modal [data-col]').forEach(x => x.classList.toggle('on', x === b)); });
  document.querySelectorAll('#modal [data-tpl]').forEach(b => b.onclick = () => { $('#pnPrompt').value = PERSONA_TEMPLATES[b.dataset.tpl]; if (!$('#pnName').value) $('#pnName').value = b.dataset.tpl; });
  $('#pnSave').onclick = async () => {
    const name_ = $('#pnName').value.trim(), prompt = $('#pnPrompt').value.trim();
    if (!name_) return toast('Give it a name.'); if (!prompt) return toast('Describe how it should behave.');
    const id = pid || push(ref(db, `ai_personas/${S.me}`)).key;
    try {
      await set(ref(db, `ai_personas/${S.me}/${id}`), { name: name_, emoji: $('#pnEmoji').value.trim(), color, tag: $('#pnTag').value.trim(), prompt, greeting: $('#pnGreet').value.trim(), temp: +$('#pnTemp').value, createdAt: p.createdAt || Date.now() });
      closeModal(); toast('Saved');
      if (isNew) { S.personas[id] = { name: name_, prompt, color }; go('chat', 'ai:' + id); }
    } catch { toast('Could not save the persona.'); }
  };
  $('#pnClear')?.addEventListener('click', async () => { await remove(ref(db, `ai_chats/${S.me}/${pid}`)); closeModal(); toast('Chat cleared'); });
  $('#pnDel')?.addEventListener('click', async () => {
    if (!confirm(pid === 'nexus' ? 'Reset NexusChat AI to its defaults?' : 'Delete this persona and its chat?')) return;
    await remove(ref(db, `ai_chats/${S.me}/${pid}`)); await remove(ref(db, `ai_personas/${S.me}/${pid}`)); closeModal();
    if (pid !== 'nexus' && S.view === 'chat') history.back();
  });
}

/* ---- Gemini call ---- */
async function geminiStream(model, sys, contents, temp, onChunk) {
  if (!fbAI) throw Object.assign(new Error('AI is not available'), { code: 'ai/none' });
  const m = getGenerativeModel(fbAI, { model, systemInstruction: sys, generationConfig: { temperature: temp } });
  const r = await m.generateContentStream({ contents });
  let full = '';
  for await (const ch of r.stream) { let t = ''; try { t = ch.text(); } catch {} if (t) { full += t; onChunk(full); } }
  return full;
}
const aiReason = e => { const m = String(e && (e.message || e)) + ' ' + (e && e.code || '');
  return /429|quota|rate|RESOURCE_EXHAUSTED/i.test(m) ? 'Too many requests right now. Wait a minute and try again.'
  : /403|PERMISSION|API key|not enabled|has not been used|disabled|app.?check/i.test(m) ? 'NexusChat AI is not switched on yet. In the Firebase console open AI Logic and enable the Gemini Developer API.'
  : /404|not found|model/i.test(m) ? 'That AI model was not found. Change the model name in Settings and privacy → AI.'
  : /SAFETY|blocked/i.test(m) ? 'I cannot answer that one. Try rephrasing.'
  : 'Could not reach the AI. Check your internet connection.'; };

async function aiSend(pid, text) {
  if (S.aiBusy) return toast('Wait for the current reply.');
  const p = aiPersona(pid); if (!p) return;
  const base = `ai_chats/${S.me}/${pid}`;
  const reply = (t, err) => push(ref(db, base + '/messages'), { from: 'ai', text: t.slice(0, 7500), ts: Date.now(), type: 'text', ...(err ? { err: true } : {}) });
  try { await push(ref(db, base + '/messages'), { from: S.me, text, ts: Date.now(), type: 'text' }); } catch { return toast('Message failed to send.'); }
  // build the conversation (merge same-role turns, must start with the user)
  let hist = S.msgs.filter(m => !m.err && (m.type || 'text') === 'text').slice(-24).map(m => ({ role: m.from === 'ai' ? 'model' : 'user', text: m.text }));
  if (!hist.length || hist[hist.length - 1].text !== text) hist.push({ role: 'user', text });
  while (hist.length && hist[0].role !== 'user') hist.shift();
  const contents = [];
  for (const h of hist) { const last = contents[contents.length - 1]; if (last && last.role === h.role) last.parts[0].text += '\n' + h.text; else contents.push({ role: h.role, parts: [{ text: h.text }] }); }
  const sys = `${p.prompt}\n\nThe user's name is ${S.profile.name || S.me}. You are chatting inside a messenger app, so keep formatting light.`;
  S.aiBusy = true; S.aiDraft = ''; stick = true; renderMsgs(true);
  let raf = 0;
  try {
    const full = await geminiStream(S.settings.aiModel || DEFAULT_MODEL, sys, contents, p.temp ?? .8, t => { S.aiDraft = t; if (!raf) raf = requestAnimationFrame(() => { raf = 0; if (S.view === 'chat' && S.chatWith === 'ai:' + pid) renderMsgs(); }); });
    S.aiBusy = false; S.aiDraft = '';
    await reply(full.trim() || '(No answer came back. Try rephrasing.)', !full.trim());
  } catch (e) {
    S.aiBusy = false; S.aiDraft = '';
    await reply(aiReason(e), true);
  }
  if (S.view === 'chat') renderMsgs(true);
}

/* ================= settings & privacy ================= */
function renderPrefs() {
  const st = S.settings, me = S.profile;
  const tog = (key, icon, title, desc, on, attr = 'data-set') => `<label class="set">${ico(icon)}<div class="t"><b>${title}</b><small>${desc}</small></div><input type="checkbox" class="sw" ${attr}="${key}" ${on ? 'checked' : ''}></label>`;
  const go_ = (k, icon, title, desc, cls = '') => `<button class="set ${cls}" data-go="${k}">${ico(icon)}<div class="t"><b>${title}</b><small>${desc}</small></div></button>`;
  $('#prefsBody').innerHTML = `
  <div class="grp"><div class="gt">Account</div>
    ${go_('edit', 'edit', 'Edit profile', 'Name, bio, photos, website')}
    ${tog('public', 'globe', 'Public account', 'Anyone can find your profile and follow you to see your posts. Only friends can message or call you. Off keeps everything friends-only.', me.pub, 'data-user')}
  </div>
  <div class="grp"><div class="gt">Privacy</div>
    ${tog('showOnline', 'eye', 'Show when I am online', 'Friends see a green dot and last seen. If off, you also cannot see theirs.', me.showOnline !== false, 'data-user')}
    ${tog('readReceipts', 'check', 'Read receipts', 'Let friends see "Seen" on their messages.', st.readReceipts !== false)}
    ${tog('typing', 'edit', 'Typing indicator', 'Let others see when you are typing.', st.typing !== false)}
    <div class="set">${ico('phone')}<div class="t"><b>Who can call me</b></div><select data-set="calls"><option value="friends" ${st.calls !== 'none' ? 'selected' : ''}>Friends</option><option value="none" ${st.calls === 'none' ? 'selected' : ''}>Nobody</option></select></div>
    ${go_('blocked', 'x', 'Blocked users', cnt(S.blocks) + ' blocked')}
  </div>
  <div class="grp"><div class="gt">Notifications</div>
    ${tog('sound', 'bell', 'Sounds', 'Play a short sound for new messages while the app is open.', st.sound !== false)}
    ${tog('alerts', 'bell', 'Device alerts', 'Show a system notification when the app is in the background. Only works while the app is still running.', !!st.alerts)}
  </div>
  <div class="grp"><div class="gt">Chat</div>
    ${tog('enterSends', 'send', 'Enter key sends', 'On computers, Enter sends and Shift+Enter adds a new line.', st.enterSends !== false)}
  </div>
  <div class="grp"><div class="gt">Appearance</div>
    <div class="swatches">${Object.entries(ACCENTS).map(([k, [a, b]]) => `<button data-accent="${k}" class="${(st.accent || 'purple') === k ? 'on' : ''}" style="background:linear-gradient(135deg,${a},${b})" aria-label="${k}"></button>`).join('')}</div>
  </div>
  <div class="grp"><div class="gt">AI</div>
    <div class="set" style="flex-direction:column;align-items:stretch;gap:8px"><div class="t"><b>Model</b><small>Change this if Google renames or retires a model.</small></div>
      <input class="input" id="pModel" value="${esc(st.aiModel || DEFAULT_MODEL)}"></div>
    ${go_('personas', 'spark', 'AI personas', cnt(S.personas) + ' custom · create characters, tutors, assistants')}
  </div>
  <div class="grp"><div class="gt">Session</div>${go_('logout', 'logout', 'Log out', '@' + esc(S.me), 'danger')}</div>
  <div style="height:30px"></div>`;
}
$('#setBtn').onclick = () => go('prefs');
$('#prefsBody').addEventListener('change', async e => {
  const t = e.target;
  try {
    if (t.dataset.user) await update(ref(db, `users/${S.me}`), { [t.dataset.user]: t.checked });
    else if (t.dataset.set === 'alerts') {
      if (t.checked && window.Notification && Notification.permission !== 'granted') { const p = await Notification.requestPermission(); if (p !== 'granted') { t.checked = false; return toast('Notifications were not allowed.'); } }
      if (t.checked && !window.Notification) { t.checked = false; return toast('Alerts are not supported here.'); }
      await set(ref(db, `settings/${S.me}/alerts`), t.checked);
    } else if (t.dataset.set) await set(ref(db, `settings/${S.me}/${t.dataset.set}`), t.type === 'checkbox' ? t.checked : t.value);
    else if (t.id === 'pModel') await set(ref(db, `settings/${S.me}/aiModel`), t.value.trim() || DEFAULT_MODEL);
  } catch { toast('Could not save that setting.'); }
});
$('#prefsBody').addEventListener('click', e => {
  const a = e.target.closest('[data-accent]');
  if (a) { set(ref(db, `settings/${S.me}/accent`), a.dataset.accent).catch(() => {}); return; }
  const g = e.target.closest('[data-go]'); if (!g) return;
  const k = g.dataset.go;
  if (k === 'edit') go('settings');
  else if (k === 'blocked') openBlocked();
  else if (k === 'personas') openPersonaList();
  else if (k === 'logout') logout();
});
</script>
